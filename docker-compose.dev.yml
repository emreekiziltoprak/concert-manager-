services:
  postgres:
    image: postgres:15-alpine
    container_name: concert_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: concert_redis
    ports:
    - "6379:6379"
    networks:
    - default

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: concert_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9229:9229"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma generate && node --inspect=0.0.0.0:9229 server.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: concert_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env.development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
