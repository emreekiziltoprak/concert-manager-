services:
  postgres:
    image: postgres:15-alpine
    container_name: concert_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: concert_redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped
    
    healthcheck: 
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: concert_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "127.0.0.1:${DEBUG_PORT:-9229}:9229"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # nodemon still drives the restart because -L (polling) is what makes file
    # changes visible through a Windows bind mount; tsx is only the executor, so
    # the entry can be .js today and .ts once it is converted.
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx nodemon -L --ext ts,js,json --ignore dist --exec 'npx tsx --inspect=0.0.0.0:9229 ./server'"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: concert_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env.development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
