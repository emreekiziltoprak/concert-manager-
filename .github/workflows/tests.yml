name: tests

on:
  push:
  workflow_dispatch:

# A new push to the same branch supersedes the run that is still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: concert_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d concert_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/concert_test
      # Stripe is mocked and no mail is sent, but stripeClient.js and
      # emailService.js read these at import time, so they must be set.
      JWT_SECRET: ci-test-secret
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
      EMAIL_USER: ci@example.com
      EMAIL_PASS: ci-dummy-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # backend/generated/prisma is gitignored, so the client is built on every run.
      # This must stay ahead of the typecheck: the Prisma types the source refers
      # to only exist once the client is generated.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test
